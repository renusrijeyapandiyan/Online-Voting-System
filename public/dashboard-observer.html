<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Observer Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#2563eb,#06b6d4);
      padding: 30px;
      color: #0f172a;
    }
    h1{
      text-align:center;
      color:white;
      margin-bottom:30px;
    }
    .cards{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:20px;
      margin-bottom:30px;
    }
    .card{
      background:white;
      border-radius:16px;
      padding:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.2);
    }
    .card h2{ margin:0; }
    .chart-box{
      background:white;
      border-radius:16px;
      padding:20px;
      box-shadow:0 10px 25px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>

  <h1>👁 Observer Panel</h1>

  <div class="cards">
    <div class="card">
      <h3>Total Votes</h3>
      <h2 id="totalVotes">0</h2>
    </div>
    <div class="card">
      <h3>Turnout</h3>
      <h2 id="turnout">0%</h2>
    </div>
    <div class="card">
      <h3>Leading Candidate</h3>
      <h2 id="leader">—</h2>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

<script>
const token = localStorage.getItem("token");
let chart;

async function loadObserver() {
  // 1️⃣ Get latest election
  const eRes = await fetch("/api/elections", {
    headers: { Authorization: "Bearer " + token }
  });
  const elections = await eRes.json();

  if (!elections.length) return alert("No election available");

  const election = elections[0];

  // 2️⃣ Get results
  const rRes = await fetch(`/api/results/${election.id}`, {
    headers: { Authorization: "Bearer " + token }
  });
  const results = await rRes.json();

  // results = [{ name: "Alice", votes: 2 }, { name: "Bob", votes: 5 }]

  const labels = results.map(r => r.name);
  const votes = results.map(r => Number(r.votes));

  // 3️⃣ Total votes
  const totalVotes = votes.reduce((a, b) => a + b, 0);
  document.getElementById("totalVotes").innerText = totalVotes;

  // 4️⃣ Turnout (fake total voters = 100 for now)
  const totalVoters = 100;
  const turnout = totalVoters ? ((totalVotes / totalVoters) * 100).toFixed(2) : 0;
  document.getElementById("turnout").innerText = turnout + "%";

  // 5️⃣ Leading candidate
  let leader = "—";
  let maxVotes = -1;
  results.forEach(r => {
    if (r.votes > maxVotes) {
      maxVotes = r.votes;
      leader = r.name;
    }
  });
  document.getElementById("leader").innerText = leader;

  // 6️⃣ Chart
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Votes",
        data: votes
      }]
    }
  });
}

loadObserver();
</script>

</body>
</html>
