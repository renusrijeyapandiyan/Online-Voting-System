<!DOCTYPE html>
<html>
<head>
<title>Online Voting Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(120deg,#2980b9,#6dd5fa,#ffffff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:40px;
width:340px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2980b9;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1c5f8a;
}

.msg{
margin-top:10px;
color:red;
}

.link{
margin-top:15px;
font-size:14px;
}
</style>
</head>

<body>

<div class="box">
<h2>Online Voting Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="msg" id="msg"></p>

<div class="link">
Don't have account? <a href="register.html">Register</a>
</div>

</div>

<script>
async function login(){

msg.innerText="";

const res = await fetch("/api/login",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
email: email.value,
password: password.value
})
});

const data = await res.json();

if(data.token){

localStorage.token = data.token;
localStorage.role = data.role;

// AUTO REDIRECT BASED ON REGISTERED ROLE
if(data.role === "Admin"){
window.location = "dashboard-admin.html";
}
else if(data.role === "Observer"){
window.location = "dashboard-observer.html";
}
else{
window.location = "dashboard-voter.html";
}

}else{
msg.innerText = data.error || "Login failed";
}
}
</script>

</body>
</html>
